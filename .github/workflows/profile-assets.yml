name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          # Needs a classic PAT with `read:user` + `public_repo` scopes,
          # stored as the TROPHY_TOKEN repo secret — the default
          # GITHUB_TOKEN lacks the OAuth scope this action's GraphQL
          # query requires.
          token: ${{ secrets.TROPHY_TOKEN }}
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          theme: react
          max-cols: "4"
          margin-width: "10"

      - name: Push generated assets to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
