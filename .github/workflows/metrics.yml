name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      # This job commits github-metrics.svg to master itself; without this,
      # its own commit re-triggers the workflow and the second run fails
      # trying to re-create a file that already exists ("sha wasn't
      # supplied").
      - github-metrics.svg

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Reuses the same PAT created for the trophy workflow
          # (read:user + public_repo already covers what this needs).
          token: ${{ secrets.TROPHY_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: "header, activity, community, repositories, metadata"
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
